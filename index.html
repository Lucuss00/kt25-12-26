<!doctype html>
<html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>I See the Light — ASCII Lantern Choice</title>
<style>
html,body{margin:0;min-height:100%;background:#08080b;color:#f2d89c;font:16px system-ui,sans-serif}
body{display:grid;place-items:center;min-height:100vh}.loading{text-align:center;letter-spacing:.04em}
.spinner{width:30px;height:30px;margin:0 auto 18px;border:2px solid #4b3b2b;border-top-color:#ffd78a;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}#status{opacity:.8}
</style>
<div class="loading"><div class="spinner"></div><div id="status">กำลังเตรียมประสบการณ์ ASCII…</div></div>
<script>
(async()=>{
 const status=document.getElementById("status");
 try{
  const parts=Array.from({length:60},(_,i)=>`deploy-parts/part-${String(i).padStart(3,"0")}.txt`);
  const responses=await Promise.all(parts.map(path=>fetch(path)));
  const failed=responses.find(r=>!r.ok);
  if(failed)throw new Error("โหลดไฟล์ส่วนประกอบไม่ครบ");
  const page=(await Promise.all(responses.map(r=>r.text()))).join("");
  document.open();document.write(page);document.close();
 }catch(error){
  status.textContent="โหลดเว็บไม่สำเร็จ กรุณารีเฟรชอีกครั้ง";
  console.error(error);
 }
})();
</script>
